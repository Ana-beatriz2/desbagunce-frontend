<div class="flex w-full items-center gap-3 rounded-card border border-border bg-surface px-4 py-3 shadow-lg">
  <span class="flex size-9 shrink-0 items-center justify-center rounded-full bg-success/10 text-success">
    <mat-icon style="font-size: 1.25rem; height: 1.25rem; width: 1.25rem">check_circle</mat-icon>
  </span>

  <p class="flex-1 text-sm font-semibold text-ink">{{ data.message }}</p>

  <button
    type="button"
    class="flex size-8 shrink-0 items-center justify-center rounded-full text-muted"
    aria-label="Fechar notificação"
    (click)="dismiss()"
  >
    <mat-icon style="font-size: 1.125rem; height: 1.125rem; width: 1.125rem">close</mat-icon>
  </button>
</div>
