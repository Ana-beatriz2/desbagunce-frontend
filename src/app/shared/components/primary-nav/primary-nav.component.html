<nav class="fixed inset-x-0 bottom-0 z-10 flex items-center border-t border-border bg-surface px-4 py-4 md:hidden">
  @for (link of links; track link.path) {
    @if (link.variant === 'fab') {
      <a [routerLink]="link.path" routerLinkActive #rla="routerLinkActive" class="-mt-8 flex min-w-0 flex-1 flex-col items-center gap-1">
        <span
          class="flex size-14 items-center justify-center rounded-full border-4 border-background bg-primary text-white shadow-lg shadow-primary/30"
        >
          <mat-icon>{{ link.icon }}</mat-icon>
        </span>
        <span class="text-[10px] font-bold tracking-wide text-primary uppercase">{{ link.label }}</span>
      </a>
    } @else {
      <a
        [routerLink]="link.path"
        routerLinkActive
        #rla="routerLinkActive"
        class="flex min-w-0 flex-1 flex-col items-center gap-1 text-center"
        [class]="rla.isActive ? 'text-primary' : 'text-ink/40'"
      >
        <mat-icon>{{ link.icon }}</mat-icon>
        <span class="text-[10px] font-bold tracking-wide uppercase">{{ link.label }}</span>
      </a>
    }
  }
</nav>

<nav class="fixed inset-y-0 left-0 z-10 hidden w-64 flex-col gap-1 border-r border-border bg-surface p-6 md:flex">
  <p class="font-display mb-4 px-3 text-xl font-bold text-primary">Desbagunce</p>
  @for (link of links; track link.path) {
    <a
      [routerLink]="link.path"
      routerLinkActive
      #rla="routerLinkActive"
      class="flex items-center gap-3 rounded-field px-3 py-3 text-sm font-semibold"
      [class]="rla.isActive ? 'bg-primary/10 text-primary' : 'text-ink/60 hover:bg-background'"
    >
      <mat-icon>{{ link.icon }}</mat-icon>
      {{ link.label }}
    </a>
  }
</nav>
