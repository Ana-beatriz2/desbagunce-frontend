@if (photoUrl(); as url) {
  <img [src]="url" [alt]="name()" class="shrink-0 rounded-full border-2 border-border object-cover" [class]="sizeClasses()" />
} @else {
  <span
    class="flex shrink-0 items-center justify-center rounded-full border-2 border-border bg-secondary-soft font-display font-semibold text-secondary"
    [class]="sizeClasses()"
  >
    {{ initials() }}
  </span>
}
