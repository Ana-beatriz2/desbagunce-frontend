<div class="flex min-h-screen flex-col items-center justify-center bg-background px-6 py-10">
  <h1 class="font-display mb-10 text-center text-4xl font-bold tracking-tight text-primary">Desbagunce</h1>

  <div class="flex w-full max-w-md flex-col gap-8 rounded-card border border-border bg-surface p-8 shadow-sm">
    <div class="flex flex-col items-center gap-2 text-center">
      <h2 class="font-display text-3xl font-semibold text-ink">Entrar</h2>
      <p class="text-sm text-muted">Bem-vindo de volta!</p>
    </div>

    <form class="flex flex-col gap-5" [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="flex flex-col gap-1.5">
        <label for="email" class="text-sm font-medium text-ink">E-mail</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="seu@email.com"
          class="w-full rounded-field border border-border bg-background/50 px-4 py-4 text-base text-ink placeholder:text-ink/40 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/30"
          [class.border-danger]="form.controls.email.invalid && form.controls.email.touched"
        />
        @if (form.controls.email.invalid && form.controls.email.touched) {
          <p class="text-xs text-danger">Informe um e-mail válido.</p>
        }
      </div>

      <div class="flex flex-col gap-1.5">
        <div class="flex items-center justify-between">
          <label for="password" class="text-sm font-medium text-ink">Senha</label>
          <span class="text-xs font-medium text-primary">Esqueceu?</span>
        </div>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Sua senha"
          class="w-full rounded-field border border-border bg-background/50 px-4 py-4 text-base text-ink placeholder:text-ink/40 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/30"
          [class.border-danger]="form.controls.password.invalid && form.controls.password.touched"
        />
        @if (form.controls.password.invalid && form.controls.password.touched) {
          <p class="text-xs text-danger">Informe sua senha.</p>
        }
      </div>

      <button mat-flat-button color="primary" type="submit" class="w-full text-base!">Entrar</button>
    </form>

    <p class="text-center text-sm text-muted">
      Não tem uma conta?
      <a routerLink="/register" class="font-bold text-primary">Cadastre-se</a>
    </p>
  </div>
</div>
