<div class="flex w-full flex-col gap-2 rounded-card border border-border bg-surface p-4">
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-4">
      <span class="flex size-12 items-center justify-center rounded-lg bg-background">
        <mat-icon>{{ item().icon }}</mat-icon>
      </span>
      <div class="flex flex-col items-start gap-1">
        <p class="text-base font-bold text-ink">{{ item().name }}</p>
        <span
          class="rounded-full px-2 py-0.5 text-[10px] font-bold tracking-wide uppercase"
          [class]="statusInfo().bg + ' ' + statusInfo().text"
        >
          {{ statusInfo().label }}
        </span>
      </div>
    </div>
    <button
      type="button"
      class="relative rounded-full bg-primary px-4 py-2 text-xs font-bold text-white disabled:opacity-70"
      [disabled]="pending()"
      [attr.aria-busy]="pending()"
      (click)="purchased.emit()"
    >
      <span [class.invisible]="pending()">Comprei</span>
      @if (pending()) {
        <span class="absolute inset-0 flex items-center justify-center" aria-hidden="true">
          <span class="size-4 animate-spin rounded-full border-2 border-white/40 border-t-white"></span>
        </span>
      }
    </button>
  </div>
  @if (failed()) {
    <p class="text-xs text-danger" role="alert">Não foi possível registrar a compra. Tente novamente.</p>
  }
</div>
